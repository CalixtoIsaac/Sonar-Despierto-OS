# Configuración de Alembic.  Uso desde backend/:  alembic upgrade head
# La URL de la BD NO va aquí: env.py la toma de la configuración de la app (app/core/config.py).

[alembic]
# %(here)s = carpeta de este archivo: funciona desde backend/ y desde la raíz del repo
script_location = %(here)s/alembic
# Agrega backend/ a sys.path para poder importar el paquete "app"
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
