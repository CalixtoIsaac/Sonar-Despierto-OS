<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Soñar Despierto</title>
  <link rel="icon" href="/img/favicon.ico">

  <script src="/js/theme.js"></script>
  <!-- Sin sesión, de vuelta al login antes de pintar nada -->
  <script>try { if (!sessionStorage.getItem('sd.token')) location.replace('/'); } catch (e) { location.replace('/'); }</script>

  <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app-shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Menú principal">
      <a class="sidebar-brand" href="#inicio" aria-label="Ir al inicio"><span data-logo="md"></span></a>
      <nav class="sidebar-nav" id="sidebarNav"></nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <span class="avatar" id="userAvatar" aria-hidden="true"></span>
          <div class="user-meta">
            <strong id="userName"></strong>
            <span id="userRole" class="muted"></span>
          </div>
        </div>
        <button class="btn btn-ghost btn-block nav-logout" id="logoutBtn" type="button">
          <span data-icon="logout"></span>Cerrar sesión
        </button>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon menu-btn" id="menuBtn" type="button"
                aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
          <span data-icon="menu"></span>
        </button>
        <h1 class="topbar-title" id="pageTitle">Inicio</h1>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-icon" type="button" data-theme-toggle></button>
          <button class="btn btn-ghost btn-sm" id="topLogoutBtn" type="button" hidden>
            <span data-icon="logout"></span>Salir
          </button>
        </div>
      </header>

      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Orden de carga: utilidades → vistas → app.js (que las registra) -->
  <script src="/js/ui-kit.js"></script>
  <script src="/js/access.js"></script>
  <script src="/js/phone.js"></script>
  <script src="/js/fechas.js"></script>
  <script src="/js/audit.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/inicio.js"></script>
  <script src="/js/perfil.js"></script>
  <script src="/js/cambiar-contrasena.js"></script>
  <script src="/js/sin-acceso.js"></script>
  <script src="/js/proximamente.js"></script>
  <script src="/js/usuarios-dialogos.js"></script>
  <script src="/js/usuarios.js"></script>
  <script src="/js/usuario-detalle.js"></script>
  <script src="/js/bitacora.js"></script>
  <script src="/js/catalogos.js"></script>
  <script src="/js/listado.js"></script>
  <script src="/js/escuelas.js"></script>
  <script src="/js/tutores.js"></script>
  <script src="/js/voluntarios.js"></script>
  <script src="/js/voluntario-detalle.js"></script>
  <script src="/js/voluntario-form.js"></script>
  <script src="/js/ninos.js"></script>
  <script src="/js/nino-detalle.js"></script>
  <script src="/js/nino-form.js"></script>
  <script src="/js/cartas-ui.js"></script>
  <script src="/js/eventos.js"></script>
  <script src="/js/evento-detalle.js"></script>
  <script src="/js/cartas.js"></script>
  <script src="/js/carta-detalle.js"></script>
  <script src="/js/carta-form.js"></script>
  <script src="/js/buscar.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
